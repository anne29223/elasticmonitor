[build]
  command = "npx vite build && npx esbuild netlify/functions/api.ts --platform=node --bundle --outfile=netlify/functions/api.js --format=esm --external:express --external:@neondatabase/serverless --external:drizzle-orm --external:cors --external:serverless-http"
  functions = "netlify/functions"
  publish = "dist/public"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "18"
  NPM_FLAGS = "--include=dev"

[context.production]
  command = "npx vite build && npx esbuild netlify/functions/api.ts --platform=node --bundle --outfile=netlify/functions/api.js --format=esm --external:express --external:@neondatabase/serverless --external:drizzle-orm --external:cors --external:serverless-http"
  
[context.branch-deploy]
  command = "npx vite build && npx esbuild netlify/functions/api.ts --platform=node --bundle --outfile=netlify/functions/api.js --format=esm --external:express --external:@neondatabase/serverless --external:drizzle-orm --external:cors --external:serverless-http"

[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization"

[functions]
  external_node_modules = ["express", "@neondatabase/serverless", "drizzle-orm"]